name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x86, x64]
    runs-on: windows-2022
    env:
      ZIP_NAME: ${{ matrix.platform }}-${{ matrix.configuration }}

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Initialize MSVC and Windows SDK
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.platform }}

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4.0

    - name: Restore NuGet packages
      run: nuget restore desk.sln -NonInteractive

    - name: Build
      run: msbuild desk.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} "/p:OutDir=$env:GITHUB_WORKSPACE/artifacts/$env:ZIP_NAME/"

    - name: Zip artifact
      run: Compress-Archive -Path "artifacts\$env:ZIP_NAME\*" -DestinationPath "$env:ZIP_NAME.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ZIP_NAME }}.zip
        if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        path: artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3.0.0
      with:
        generate_release_notes: true
        files: artifacts/**/*.zip
        fail_on_unmatched_files: true
