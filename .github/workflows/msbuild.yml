name: desk.cpl

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x86,x64]
    runs-on: windows-2022
    env:
      ZIP_NAME: ${{ matrix.platform }}-${{ matrix.configuration }}

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Initialize MSVC and Windows SDK
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.platform }}

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3
      
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4.0

    - name: Restore NuGet packages
      run: nuget restore desk.sln -NonInteractive

    - name: Build
      run: msbuild desk.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} "/p:OutDir=$env:GITHUB_WORKSPACE/artifacts/$env:ZIP_NAME/"

    - name: Upload
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ env.ZIP_NAME }}
        path: artifacts/${{ env.ZIP_NAME }}/
        if-no-files-found: error
